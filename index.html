<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicClean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfdfc;--ink:#10302b;--muted:#4f6b63;--green:#13805a;--lime:#8a9a3a;--mint:#cbe6dc;--line:#cfe3da;--card:#fff;--red:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--ink:#e8f3ef;--muted:#9bb5ac;--green:#3ec28f;--lime:#b5c55a;--mint:#1c3a31;--line:#24443a;--card:#142721;--red:#e57a64;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a17;--ink:#e8f3ef;--muted:#9bb5ac;--green:#3ec28f;--lime:#b5c55a;--mint:#1c3a31;--line:#24443a;--card:#142721;--red:#e57a64;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 24px 60px}
nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;gap:12px;flex-wrap:wrap}
.logo{font:600 22px "Space Grotesk",sans-serif;cursor:pointer}.logo span{color:var(--green)}
nav a{font:500 15px "Space Grotesk",sans-serif;color:var(--ink);cursor:pointer;margin-left:20px}
.eyebrow{font:600 12px "Space Grotesk",sans-serif;letter-spacing:.14em;color:var(--green);margin-top:44px}
h1{font:500 clamp(42px,9vw,70px)/1.05 "Space Grotesk",sans-serif;margin:14px 0 20px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--green);display:block}
h2{font:500 28px "Space Grotesk",sans-serif;margin:8px 0 16px}
.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:560px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin:28px 0 18px}
.btn{font:600 15px "Space Grotesk",sans-serif;padding:13px 22px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}.btn.r{color:var(--red)}
.badges{display:flex;gap:18px;font-size:13px;flex-wrap:wrap}.badges span::before{content:"✓ ";color:var(--green)}
.pulse{margin:48px 0 0;padding:26px;background:var(--card);border-radius:10px;border-right:20px solid var(--mint);border-bottom:20px solid var(--mint)}
.pulse small{font:600 11px "Space Grotesk",sans-serif;letter-spacing:.06em;color:var(--lime)}
.stat{border-left:3px solid #d9e27a;padding-left:16px;margin-top:40px}
.stat b{display:block;font:600 44px "Space Grotesk",sans-serif;color:var(--lime)}.stat span{color:var(--muted);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;border-top:1px solid var(--line);margin-top:48px;padding-top:28px}
.steps small{font:600 13px "Space Grotesk",sans-serif;color:var(--green)}
.steps h3{font:500 20px "Space Grotesk",sans-serif;margin:10px 0 6px}.steps p{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=password],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0}
.photos figure{margin:0}.photos img{width:100%;border-radius:8px;display:block;max-height:320px;object-fit:cover}
figcaption{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--mint);color:var(--green)}
.tag.w{color:#9a6a10;background:#f6e8c4}.muted{color:var(--muted);font-size:14px}
.cam{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000;display:block}.loc{font-size:13px;color:var(--muted);margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.photos{grid-template-columns:repeat(2,1fr)}.photos img{aspect-ratio:1;object-fit:cover;cursor:zoom-in;max-height:none}
.tag.r{color:var(--red);background:rgba(179,64,42,.14)}
.remark{border-left:3px solid var(--green);background:var(--mint);padding:10px 12px;border-radius:6px;margin-top:10px;font-size:14px}
.remark.bad{border-color:var(--red);background:rgba(179,64,42,.12)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center}
.tile b{display:block;font:600 28px "Space Grotesk",sans-serif;color:var(--green)}.tile span{font-size:12px;color:var(--muted)}
.how{color:var(--muted);font-size:14px;line-height:1.7;padding-left:20px;margin:0 0 18px}
h3{font:500 19px "Space Grotesk",sans-serif;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;z-index:60;font-size:14px;max-width:90%}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50}.zm img{max-width:96%;max-height:96%}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 30px}

nav{flex-wrap:nowrap;gap:8px;padding:20px 0}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;white-space:nowrap}.logo svg{flex:none}.logo b{font-weight:600}
#nv{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:2px 12px;text-align:right}
nav a{margin-left:0;font-size:13px;color:var(--muted);white-space:nowrap}
#nv .muted{font-size:13px}
h1{font-size:clamp(44px,13vw,76px);line-height:1.02}h1 span{display:block}
.tiles{gap:8px}.tile{padding:10px 6px;border-radius:8px}.tile b{font-size:20px}.tile span{font-size:11px;line-height:1.25;display:block;margin-top:2px}
:root{--lgbg:#e6f3ed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lgbg:#0f211c}}
:root[data-theme="dark"]{--lgbg:#0f211c}
body.lg{background:var(--lgbg)}body.lg nav{display:none}
.lgwrap{max-width:440px;margin:0 auto;padding:48px 0 16px}
.lgcard{background:var(--card);border-top:3px solid var(--green);padding:28px 24px;box-shadow:0 20px 50px rgba(16,48,43,.12)}
.lgbrand{display:flex;align-items:center;gap:10px;font:600 22px "Space Grotesk",sans-serif}.lgbrand svg{width:40px;height:40px}.lgbrand b span{color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--green);font:600 14px "Space Grotesk",sans-serif;padding:8px 14px;border-radius:99px;margin:22px 0 18px}.pill i{width:10px;height:10px;border-radius:50%}
.lgcard h2{font-size:34px;margin:0 0 8px}.lgcard p{color:var(--muted);margin:0 0 12px;font-size:17px}
.lgcard label{font-weight:600}
.lgbtn{width:100%;margin-top:22px;background:var(--green);color:#fff;border:0;border-radius:8px;padding:15px;font:600 17px "Space Grotesk",sans-serif;cursor:pointer}
.lgnote{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--muted);font-size:14px;margin-top:20px}
.lgback{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:14px;cursor:pointer}
footer.cr{max-width:960px;margin:0 auto;padding:36px 24px calc(28px + env(safe-area-inset-bottom,0px))}
footer.cr small{display:block;font-size:17px}
.av{width:84px;height:84px;border-radius:50%;margin:14px auto 12px;background:linear-gradient(135deg,#10302b,#13805a);color:#d6e86a;font:600 28px "Space Grotesk",sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--mint)}
footer.cr b{display:block;font:600 24px "Space Grotesk",sans-serif;color:var(--ink)}
footer.cr span{display:block;font-size:17px;margin-top:4px}
footer.cr hr{border:0;border-top:1px solid var(--line);margin:26px 0 18px}
footer.cr p{margin:0;font-size:14px}footer.cr i{color:#e0643a;font-style:normal}
.wrap{min-height:100vh}
footer.cr{margin-top:56px}
.av{width:60px;height:60px;font-size:20px;margin:12px auto 10px;box-shadow:0 0 0 4px var(--mint)}
footer.cr b{font-size:21px}footer.cr small,footer.cr span{font-size:15px}
</style>
</head>
<body>
<div class="wrap"><nav>
<div class="logo" id="lgo" onclick="go('home')"></div>
<div id="nv"></div></nav><div id="app"></div></div>
<footer class="cr"><small>Created by</small><div class="av">HM</div><b>Himanshu Meshram</b><span>Creator &amp; Developer</span><hr><p>Made with <i>♥</i> for the people · © 2026 CivicClean</p></footer>
<script>
let S={view:'home',role:null,user:null,tmp:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method,body){
 const r=await fetch(url,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||'Something went wrong');
 return d}
function go(v,role){S.view=v;if(role)S.role=role;S.tmp={};render()}
async function logout(){try{await api('/api/logout','POST')}catch(e){}S.user=null;S.role=null;go('home')}
function lbl(loc,t){return (loc?loc[0].toFixed(5)+', '+loc[1].toFixed(5):'Location not shared')+' · '+new Date(t).toLocaleString()}
function stamp(c,loc,place){const g=c.getContext('2d'),h=Math.round(c.width/26),H=h*(place?3.6:2.1);
 g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,c.height-H,c.width,H);g.fillStyle='#fff';g.textBaseline='middle';
 let y=c.height-H+h*1.05;
 if(place){g.font='600 '+h+'px sans-serif';g.fillText(''+place,h*.5,y,c.width-h);y+=h*1.5}
 g.font=(place?h*.8:h)+'px sans-serif';g.fillText((place?'':'')+lbl(loc,Date.now()),h*.5,y,c.width-h);
 return c.toDataURL('image/jpeg',.7)}
function compress(f,loc,place){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(stamp(c,loc,place))};i.src=URL.createObjectURL(f)})}
const LOGO='<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#10302b"/><path d="M12 25c0-7 5-11 13-11 0 8-4 12-11 12" fill="none" stroke="#d6e86a" stroke-width="1.8" stroke-linecap="round"/><path d="M12 28c3-5 6-8 11-10" fill="none" stroke="#d6e86a" stroke-width="1.6" stroke-linecap="round"/><circle cx="27" cy="27" r="5" fill="#10302b" stroke="#fff" stroke-width="1.6"/><circle cx="27" cy="27" r="1.6" fill="#fff"/></svg>';
const BRAND='<b>Civic<span>Clean</span></b>';
const SHIELD='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>';
async function placeName(l){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);const r=await fetch('/api/geocode?lat='+l[0]+'&lng='+l[1],{signal:c.signal});clearTimeout(t);return (await r.json()).name||''}catch(e){return ''}}
let LOC=null,LOC_T=0,WATCH=null,GPSFAIL=false,PLACE='',PLACE_AT=null,PLTRY=0,PLBUSY=false;
const sl=ms=>new Promise(r=>setTimeout(r,ms));
function dist(a,b){return Math.hypot((a[0]-b[0])*111000,(a[1]-b[1])*111000*Math.cos(a[0]*Math.PI/180))}
function setLoc(p){LOC=[p.coords.latitude,p.coords.longitude];LOC_T=Date.now();GPSFAIL=false;refreshPlace();gpsLine()}
function coarse(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(!LOC)setLoc(p)},()=>{},{enableHighAccuracy:false,maximumAge:120000,timeout:10000})}
function startGps(){if(!navigator.geolocation||WATCH!==null)return;
 coarse();
 WATCH=navigator.geolocation.watchPosition(setLoc,e=>{if(e.code===1){GPSFAIL=true;gpsLine()}},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
 setTimeout(()=>{if(!LOC){GPSFAIL=true;gpsLine()}},25000)}
function stopGps(){if(WATCH!==null&&navigator.geolocation)navigator.geolocation.clearWatch(WATCH);WATCH=null}
function retryGps(){stopGps();LOC=null;GPSFAIL=false;gpsLine();startGps()}
async function refreshPlace(){if(!LOC||PLBUSY||Date.now()-PLTRY<10000)return;if(PLACE&&PLACE_AT&&dist(LOC,PLACE_AT)<40)return;
 PLBUSY=true;PLTRY=Date.now();const at=LOC.slice(),n=await placeName(at);PLBUSY=false;if(n){PLACE=n;PLACE_AT=at}gpsLine()}
function gpsLine(){const g=$('gp'),r=$('rg');if(g)g.textContent=LOC?(PLACE?PLACE+' · ':'')+LOC.map(n=>n.toFixed(5)).join(', '):GPSFAIL?'GPS is off. Allow location for this site (lock icon in the address bar), then tap Retry GPS.':'Checking GPS…';if(r)r.hidden=!!LOC||!GPSFAIL}
async function whereAmI(fresh,maxWait){startGps();if(fresh&&!LOC)coarse();
 const end=Date.now()+(maxWait||25000);while(!LOC&&Date.now()<end)await sl(300);
 if(!LOC)return {loc:null,place:''};
 const ok=()=>PLACE&&PLACE_AT&&dist(LOC,PLACE_AT)<150;
 if(!ok()){const t=Date.now();while(PLBUSY&&Date.now()-t<4500)await sl(200);if(!ok()){PLTRY=0;await Promise.race([refreshPlace(),sl(4500)])}}
 return {loc:LOC.slice(),place:ok()?PLACE:''}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopGps();else startGps()});
let STREAM=null;
function stopCam(){if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null}}
async function startCam(id){stopCam();try{STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$(id).srcObject=STREAM;return true}catch(e){stopCam();return false}}
function grab(id,loc,place){const v=$(id),s=Math.min(v.videoWidth,v.videoHeight);if(!s)return null;const c=document.createElement('canvas');c.width=c.height=Math.min(s,800);c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,c.width,c.height);return stamp(c,loc,place)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function zoom(s){const d=document.createElement('div');d.className='zm';d.innerHTML='<img src="'+s+'" alt="Photo">';d.onclick=()=>d.remove();document.body.appendChild(d)}
const LBL={pending:['Waiting for worker','w'],cleaned:['Awaiting admin approval','w'],approved:['Approved',''],rejected:['Sent back for rework','r']};
function badge(r){const l=LBL[r.status];return `<span class="tag ${l[1]}">${l[0]}</span>`}
function fig(s,c){return `<figure><figcaption>${c}</figcaption><img src="${s}" alt="${c}" onclick="zoom(this.src)"></figure>`}
function remark(r){
 if(r.status==='rejected')return `<div class="remark bad"><b>Sent back by ${esc(r.rby)}</b><br>${esc(r.remark)}</div>`;
 if(r.status==='approved')return `<div class="remark"><b>Approved by ${esc(r.rby)}</b>${r.remark?`<br>${esc(r.remark)}`:''}</div>`;
 return ''}
function card(r,extra=''){return `<div class="card"><div class="top"><b>${esc(r.addr)}</b>${badge(r)}</div>
 <p class="muted">Reported by ${esc(r.by)}${r.worker?` · Cleaned by ${esc(r.worker)}`:''}<br>${r.lat!=null?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</a>`:'Location not shared'} · ${new Date(r.at).toLocaleString()}${r.desc?`<br>${esc(r.desc)}`:''}</p>
 <div class="photos">${fig(r.before,'BEFORE')}${r.after?fig(r.after,r.status==='rejected'?'PREVIOUS AFTER':'AFTER'):''}</div>${remark(r)}${extra}</div>`}
function tiles(a){return `<div class="tiles">${a.map(t=>`<div class="tile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>`}
function intro(t,p,s){return `<h2>${t}</h2><p class="lead" style="font-size:16px;margin:0 0 12px">${p}</p><ol class="how">${s.map(x=>`<li>${x}</li>`).join('')}</ol>`}
async function citizen(){
 const d=await api('/api/reports'),L=d.reports,ok=L.filter(r=>r.status==='approved').length;
 $('app').innerHTML=intro(`Hi ${esc(S.user)}`,'Spot garbage on your street? Take a photo and your report reaches the cleaning team in seconds.',['Allow camera and location when your phone asks.','Point at the garbage and tap Capture. Check the preview, then tap Upload.','Track it below until the admin approves the clean-up.'])
 +tiles([[L.length,'your reports'],[ok,'resolved'],[L.length-ok,'in progress']])
 +`<div class="card"><h3>New report</h3>
 <div id="cam" hidden><video id="vd" class="cam" autoplay playsinline muted></video><div class="row" style="margin:10px 0"><button class="btn p" onclick="snap()">Capture</button></div></div>
 <p class="muted" id="cm"></p>
 <div class="row" style="margin:8px 0"><button class="btn p" id="oc" onclick="openCam()">📷 Open camera</button><label class="btn" style="margin:0">Upload photo<input type="file" accept="image/*" hidden onchange="pick(this)"></label></div>
 <div id="gp" class="loc">Checking GPS…</div><button class="btn" id="rg" hidden onclick="retryGps()" style="margin:4px 0 8px">Retry GPS</button><div id="pv"></div>
 <div id="fm" hidden><label>Location (you can edit)</label><input type="text" id="ad"><label>Details (optional)</label><textarea id="ds" rows="2"></textarea><div class="row"><button class="btn p" onclick="submitReport()">Upload report</button><button class="btn" onclick="retake()">🔄 Retake</button></div></div></div>
 <h2>My reports</h2>${L.map(r=>card(r)).join('')||'<p class="muted">No reports yet. Your first photo can change a street</p>'}`;
 startGps();gpsLine();
 openCam(true)}
async function openCam(auto){const ok=await startCam('vd');if(!$('cam'))return;$('cam').hidden=!ok;$('oc').hidden=ok;
 $('cm').textContent=ok||!auto?'':'Camera did not open. Tap Open camera and allow permission, or upload a photo.';
 if(!ok&&!auto)alert('Camera is not available. Please allow camera permission, or use Upload photo.')}
async function here(){if(!LOC)toast('Getting your location. Please wait...');return whereAmI(true,15000)}
async function snap(){const g=await here(),b=grab('vd',g.loc,g.place);if(!b)return;S.tmp.before=b;S.tmp.g=g;stopCam();showPv()}
async function pick(el){const f=el.files[0];el.value='';if(!f)return;const g=await here();S.tmp.before=await compress(f,g.loc,g.place);S.tmp.g=g;stopCam();showPv()}
function showPv(){$('cam').hidden=true;$('oc').hidden=true;$('pv').innerHTML=`<img src="${S.tmp.before}" alt="Preview" style="width:100%;max-width:420px;border-radius:8px;margin-top:10px">`;$('ad').value=S.tmp.g.place||'';$('fm').hidden=false}
function retake(){S.tmp.before=null;$('pv').innerHTML='';$('fm').hidden=true;$('oc').hidden=false;openCam()}
async function submitReport(){
 if(!S.tmp.before||S.tmp.busy)return;
 const g=S.tmp.g||{},a=$('ad').value.trim()||g.place||'',loc=g.loc;
 if(!loc&&!a)return alert('GPS is off. Please type the location.');
 S.tmp.busy=1;
 try{await api('/api/reports','POST',{before:S.tmp.before,addr:a||'GPS location',desc:$('ds').value.trim(),lat:loc?loc[0]:null,lng:loc?loc[1]:null});S.tmp={};toast('Report sent. Thank you!');render()}catch(e){S.tmp.busy=0;alert(e.message)}}
async function worker(){
 const d=await api('/api/reports'),T=d.reports,R=d.record,c=s=>R.filter(r=>r.status===s).length;
 $('app').innerHTML=intro(`Hello ${esc(S.user)}`,'Every clean-up you finish makes a street better. Here is what is waiting for you.',['Open a job and go to the spot (tap the GPS link for the map).','Clean it up, take the after photo, check the preview, then upload.','The admin checks your work. The verdict and remark show in your record below.'])
 +tiles([[T.length,'to clean'],[c('cleaned'),'awaiting approval'],[c('approved'),'approved']])
 +`<div id="gp" class="loc">Checking GPS…</div><button class="btn" id="rg" hidden onclick="retryGps()" style="margin:4px 0 8px">Retry GPS</button><h2>To clean</h2>${T.map(r=>card(r,`<div id="cw${r.id}"><div class="row" style="margin:12px 0 0"><button class="btn p" onclick="wcam(${r.id})">📷 Take after photo</button><label class="btn" style="margin:0">Upload photo<input type="file" accept="image/*" hidden onchange="done(${r.id},this)"></label></div></div>`)).join('')||'<p class="muted">All clear! No jobs waiting. Take a break</p>'}
 <h2>My work record</h2>${R.map(r=>card(r)).join('')||'<p class="muted">Your finished jobs will appear here with before and after photos and the admin’s verdict.</p>'}`;
 startGps();gpsLine()}
function wbox(id){const b=$('cw'+id);if(!b)return null;stopCam();
 const p=S.cur&&S.cur!==id?$('cw'+S.cur):null;if(p&&p.dataset.o)p.innerHTML=p.dataset.o;
 S.cur=id;if(!b.dataset.o)b.dataset.o=b.innerHTML;return b}
async function wcam(id){const b=wbox(id);if(!b)return;
 b.innerHTML=`<video id="wv" class="cam" autoplay playsinline muted></video><div class="row" style="margin:10px 0"><button class="btn p" onclick="wsnap(${id})">Capture</button><button class="btn" onclick="stopCam();worker()">Cancel</button></div>`;
 if(!await startCam('wv')){alert('Camera is not available. Please allow camera permission, or use Upload photo.');worker()}}
async function wsnap(id){const g=await here(),a=grab('wv',g.loc,g.place);if(!a)return;stopCam();wprev(id,a,g)}
async function done(id,el){const f=el.files[0];el.value='';if(!f)return;const g=await here();wprev(id,await compress(f,g.loc,g.place),g)}
function wprev(id,img,g){const b=wbox(id);if(!b)return;S.tmp.pa={id,img,g};
 b.innerHTML=`<img src="${img}" alt="Preview" style="width:100%;max-width:420px;border-radius:8px;margin-top:12px"><div class="row" style="margin:10px 0 0"><button class="btn p" onclick="wsend()">Upload after photo</button><button class="btn" onclick="wcam(${id})">🔄 Retake</button><button class="btn" onclick="worker()">Cancel</button></div>`}
async function wsend(){const p=S.tmp.pa;if(!p||S.tmp.busy)return;S.tmp.busy=1;
 try{await api('/api/reports/'+p.id+'/clean','POST',{after:p.img,lat:p.g.loc?p.g.loc[0]:null,lng:p.g.loc?p.g.loc[1]:null});S.tmp={};toast('After photo submitted. Waiting for admin.');render()}catch(e){S.tmp.busy=0;alert(e.message)}}
async function admin(){
 const d=await api('/api/reports'),W=d.reports,R=d.record,c=s=>R.filter(r=>r.status===s).length;
 $('app').innerHTML=intro(`Welcome, ${esc(S.user)}`,'You are the quality check. Compare the before and after photos and decide if the clean-up is really done.',['Tap a photo to zoom in.','Write a remark. It is required when you send a job back, and the worker sees it in their record.','Approve to mark the report resolved, or send it back for rework.'])
 +tiles([[W.length,'waiting for review'],[c('approved'),'approved'],[c('rejected'),'sent back']])
 +`<h2>Waiting for review</h2>${W.map(r=>card(r,`<label>Remark for the worker</label><textarea id="rm${r.id}" rows="2" placeholder="e.g. Great job! / Please clean the left corner too"></textarea><div class="row" style="margin:10px 0 0"><button class="btn p" onclick="review(${r.id},1)">Approve</button><button class="btn r" onclick="review(${r.id},0)">Send back</button></div>`)).join('')||'<p class="muted">Nothing to review right now. You are all caught up</p>'}
 <h2>Review record</h2>${R.map(r=>card(r)).join('')||'<p class="muted">Approved and sent-back reports will be listed here.</p>'}`}
async function review(id,ok){const remark=(($('rm'+id)||{}).value||'').trim();
 if(!ok&&!remark)return alert('Please write a remark so the worker knows what to fix.');
 try{await api('/api/reports/'+id+'/review','POST',{approve:!!ok,remark});toast(ok?'Approved':'Sent back to the worker');render()}catch(e){alert(e.message)}}
async function render(){
 stopCam();
 document.body.classList.toggle('lg',S.view==='login');
 $('nv').innerHTML=S.user?`<span class="muted">${esc(S.user)} (${S.role})</span><a onclick="logout()">Log out</a>`:`<a onclick="go('login','worker')">Worker access</a><a onclick="go('login','admin')">Admin access</a>`;
 try{await ({home,login,citizen,worker,admin})[S.view]()}catch(e){if(S.user){S.user=null;S.view='login'}alert(e.message);if(S.view==='login')render()}}
async function home(){
 const w=(await api('/api/stats')).week;
 $('app').innerHTML=`
<div class="eyebrow">✦ CLEANER STREETS, TOGETHER</div>
<h1><span>Report.</span><span>Clean.</span><em>Transform.</em></h1>
<p class="lead">One clear signal can change a neighbourhood. CivicClean connects citizens and sanitation teams to keep every corner cared for.</p>
<div class="row"><button class="btn p" onclick="go('login','citizen')">Report garbage</button><button class="btn" onclick="go('login','citizen')">Citizen sign in</button></div>
<div class="badges"><span>GPS verified</span><span>Human reviewed</span></div>
<div class="pulse"><small>LIVE CIVIC PULSE</small><div class="stat"><b>${w}</b><span>reports resolved<br>this week</span></div></div>
<div class="steps"><div><small>01</small><h3>Spot it</h3><p>Citizen uploads a photo of the garbage.</p></div><div><small>02</small><h3>Locate it</h3><p>Worker finds the spot and cleans it.</p></div><div><small>03</small><h3>Resolve it</h3><p>Admin checks before and after, then approves.</p></div></div>`}
function login(){
 const r=S.role,C={citizen:['Citizen Portal','#13805a','Email address','citizen'],worker:['Worker Portal','#e0963a','Worker ID / email','worker'],admin:['Admin Portal','#3a6ea5','Email address','admin']}[r];
 $('app').innerHTML=`<div class="lgwrap"><div class="lgcard">
<div class="lgbrand">${LOGO}${BRAND}</div>
<div class="pill"><i style="background:${C[1]}"></i>${C[0]}</div>
<h2>Welcome back</h2><p>Sign in to the ${C[3]} workspace.</p>
<label>${C[2]}</label><input type="text" id="em" value="himanshu@gmail.com" autocomplete="username">
<label>Password</label><input type="password" id="pw" value="admin123" autocomplete="current-password">
<button class="lgbtn" onclick="doLogin()">Sign in <span>→</span></button>
${r!=='admin'?`<div class="lgnote">${SHIELD}Your data stays connected to your account.</div>`:''}
</div><a class="lgback" onclick="go('home')">Back to home</a></div>`}
async function doLogin(){
 const e=$('em').value.trim();if(!e)return alert('Please enter your email');
 try{const d=await api('/api/login','POST',{role:S.role,email:e,password:$('pw').value});S.user=d.name;go(S.role)}catch(x){alert(x.message)}}
$('lgo').innerHTML=LOGO+BRAND;
(async()=>{try{const m=await api('/api/me');if(m.name){S.user=m.name;S.role=m.role;S.view=m.role}}catch(e){}render()})();
</script>
</body>
